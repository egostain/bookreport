<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>독후감 노트</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4c6290">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="독후감노트">
<style>
:root{--blue:#4c6290;--blue2:#3a4d77;--bl:#e3e9f4;--bm:#d0daec;--bg:#e8ecf2;--card:#fff;--ink:#263042;--sub:#6b778a;--line:#d9e0ea;--gray:#aab4c4;--warn:#d6455d;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + var(--safe-b))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:linear-gradient(180deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 2px 10px rgba(58,77,119,.25)}
.top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.3px}
.top small{display:block;opacity:.8;font-size:12px;margin-top:-2px}
.top .grow{flex:1;min-width:0}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.16);font-size:20px;color:#fff}
.ib:active{background:rgba(255,255,255,.3)}
.mon{display:block;flex:none}
.pad{padding:14px}
.stat{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(40,60,100,.08)}
.stat b{font-size:17px}
.stat .n{color:var(--blue);font-size:22px;font-weight:800}
.stat span.s{color:var(--sub);font-size:13px;margin-left:auto;text-align:right}
.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 42px 0 42px;outline:none}
.search input:focus{border-color:var(--blue)}
.search .mg{position:absolute;left:14px;top:11px;color:var(--gray);font-size:18px;pointer-events:none}
.search .cl{position:absolute;right:6px;top:5px;width:36px;height:36px;border-radius:10px;color:var(--gray);font-size:18px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;padding:3px 12px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.tag{background:var(--bl);border-color:var(--bl);color:var(--blue2)}
.chip.tag.on{background:var(--blue);color:#fff}
.chip.grp{background:#e9edf3;border-color:#e9edf3;color:#56627a;font-size:12.5px;padding:1px 9px}
.sel{margin-left:auto;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:3px 8px;font-size:13.5px;color:var(--sub)}
.card{background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(40,60,100,.08);display:block;width:100%;text-align:left}
.card:active{background:#f6f8fc}
.card .ct{display:flex;gap:8px;align-items:baseline}
.card h3{margin:0;font-size:16.5px;flex:1;min-width:0;overflow-wrap:anywhere}
.rt{color:var(--blue);font-weight:700;font-size:14px;white-space:nowrap}
.rt.none{color:var(--gray);font-weight:500}
.meta{font-size:12.5px;color:var(--sub);margin:2px 0 6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.tg{background:var(--bl);color:var(--blue2);border-radius:8px;padding:0 7px;font-size:12.5px}
.sn{margin:0;color:#556176;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;padding:36px 10px;color:var(--sub)}
.empty .mon{margin:0 auto 8px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(18px + var(--safe-b));z-index:6;background:var(--blue);color:#fff;border-radius:999px;height:54px;padding:0 22px;font-weight:700;box-shadow:0 6px 16px rgba(58,77,119,.4);display:flex;align-items:center;gap:6px;font-size:16px}
.fab:active{background:var(--blue2)}
.draft{display:flex;align-items:center;gap:8px;background:#fff8e3;border:1.5px solid #f2dc95;border-radius:14px;padding:9px 12px;margin-bottom:10px;font-size:14px}
.draft .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border-radius:12px;padding:8px 14px;font-weight:700;font-size:14.5px;background:var(--bl);color:var(--blue2)}
.btn.pri{background:var(--blue);color:#fff}
.btn.dng{background:#fde8ec;color:var(--warn)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:10px}
.btn.wide{display:block;width:100%;padding:12px;font-size:15.5px}
.btn:disabled{opacity:.5}
label.f{display:block;font-weight:700;font-size:14px;margin:16px 0 6px;color:#3b4658}
label.f small{font-weight:400;color:var(--sub)}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:none}
.in:focus{border-color:var(--blue)}
textarea.in{min-height:46vh;line-height:1.7;resize:none;overflow:hidden}
.stars{display:flex;align-items:center;gap:2px}
.star{position:relative;width:42px;height:42px;display:block}
.star svg{position:absolute;inset:3px;width:36px;height:36px}
.star .h{position:absolute;top:0;bottom:0;width:50%;z-index:2}
.star .h.l{left:0}.star .h.r{right:0}
.rv{font-weight:800;color:var(--blue);margin-left:8px;min-width:40px}
.sec{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.sec h4{margin:0 0 6px;font-size:13.5px;color:var(--sub);display:flex;align-items:center;gap:6px}
.sec .kin{display:flex;gap:6px;margin:6px 0 0}
.sec .kin input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;font-size:14px;outline:none;min-width:0}
.sec .kin input:focus{border-color:var(--blue)}
.sel-tags{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;margin-bottom:8px}
.sel-tags .ph{color:var(--gray);font-size:13.5px;padding:4px 0}
.saved{font-size:12.5px;color:var(--sub);text-align:right;margin-top:6px}
.det h2{margin:0 0 4px;font-size:21px;overflow-wrap:anywhere}
.det .ro{display:flex;align-items:center;gap:4px;margin:6px 0}
.det .ro svg{width:24px;height:24px}
.note{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border-radius:14px;padding:14px;margin-top:12px;line-height:1.8;font-size:15.5px;box-shadow:0 1px 3px rgba(40,60,100,.06)}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.links a{text-decoration:none;font-size:13px;background:#e9edf3;color:#44506a;border-radius:10px;padding:5px 10px}
.set h3{margin:20px 0 8px;font-size:14px;color:var(--sub)}
.box{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(40,60,100,.06)}
.box p{margin:0 0 8px;font-size:14px;color:#4a5568}
.box .r2{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:13px;color:var(--sub);margin-top:6px;word-break:break-all}
#toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%);background:rgba(39,48,63,.94);color:#fff;border-radius:14px;padding:10px 16px;font-size:14.5px;z-index:50;display:none;align-items:center;gap:12px;max-width:90vw}
#toast button{color:#9fc0ff;font-weight:800}
.ov{position:fixed;inset:0;background:rgba(30,40,60,.5);z-index:60;display:grid;place-items:center;padding:20px}
.dlg{background:#fff;border-radius:18px;padding:20px;max-width:340px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.dlg p{margin:0 0 16px;white-space:pre-wrap;line-height:1.6}
.dlg .r2{display:flex;gap:8px;justify-content:flex-end}
#lock,#cover{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#e8effd,#cfdcf9 55%,#b9c7e6);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#lock.show,#cover.show{display:flex}
#cover{z-index:99}
#lock h2{margin:6px 0 2px;font-size:20px}
#lock p.s{margin:0 0 14px;color:var(--sub);font-size:14px;min-height:21px}
.dots{display:flex;gap:14px;margin:6px 0 18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--blue);background:transparent;transition:.12s}
.dots i.on{background:var(--blue)}
.dots.err{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pad4{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad4 button{height:62px;border-radius:50%;background:#fff;font-size:24px;font-weight:600;box-shadow:0 2px 6px rgba(40,60,100,.14);color:var(--ink)}
.pad4 button:active{background:var(--bm)}
.pad4 button.e{background:transparent;box-shadow:none;pointer-events:none}
.pad4 button.k{font-size:20px;background:transparent;box-shadow:none}
#lock .fg{margin-top:18px;color:var(--blue2);font-size:13.5px;text-decoration:underline}
@media (max-height:640px){.pad4 button{height:52px}.pad4{gap:8px}}

/* --- v2 디자인 다듬기 --- */
.top{background:linear-gradient(180deg,#52689a,#43587f);box-shadow:0 2px 12px rgba(58,77,119,.22)}
.top h1{font-weight:700;font-size:17px;letter-spacing:-.2px}
.top .mon{margin:-2px 0 -4px}
.ib{background:rgba(255,255,255,.14);border-radius:14px}
.card,.stat,.box,.note{box-shadow:0 2px 10px rgba(50,70,110,.07);border:1px solid rgba(255,255,255,.9)}
.card{border-radius:18px;padding:14px 15px}
.card h3{font-weight:700;font-size:16px}
.stat{border-radius:18px}
.search input{background:#f5f7fb;border-color:#d6dde9;border-radius:15px}
.search input:focus{background:#fff}
.chip{background:#f7f9fc}
.chip.on{background:var(--blue);color:#fff}
.tg{background:#e1e8f3;color:#4a5f85;border:0;border-radius:9px;padding:1px 8px}
button.tg{font-size:12.5px}
.chip.tag{background:#e1e8f3;border-color:#e1e8f3;color:#4a5f85}
.chip.tag.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fab{background:linear-gradient(180deg,#566d9d,#46598a);box-shadow:0 8px 18px rgba(58,77,119,.38)}
.btn.pri{background:var(--blue)}
#lock,#cover{background:linear-gradient(180deg,#eaeff9 0%,#cfd9ee 55%,#b7c5e2 100%)}
#lock>.mon,#cover>.mon{height:min(150px,22vh);width:auto;margin-bottom:6px;filter:drop-shadow(0 6px 8px rgba(58,77,119,.18))}
#lock h2{font-size:19px;font-weight:800;margin:10px 0 2px}
.pad4{grid-template-columns:repeat(3,84px);gap:12px 14px}
.pad4 button{height:60px;border-radius:50%/50%;font-size:23px;font-weight:600;box-shadow:0 2px 8px rgba(58,77,119,.13)}
.dots i{border-color:#5a6f9c}
.dots i.on{background:#5a6f9c}
.empty .mon{height:120px;width:auto}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="lock"></div>
<div id="cover"></div>
<script>
'use strict';
/* ============ 유틸 ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('저장 공간이 부족해요. 구글 동기화/내보내기 후 정리해 주세요'); return false; } }
};
const rid = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const two = n => String(n).padStart(2, '0');
const fmtDate = t => { const d = new Date(t); return d.getFullYear() + '.' + two(d.getMonth() + 1) + '.' + two(d.getDate()); };
const fmtTime = t => { const d = new Date(t); return two(d.getHours()) + ':' + two(d.getMinutes()); };
const norm = s => String(s || '').toLowerCase().replace(/[\s·・\-_.,!?~:：'"“”‘’()\[\]（）]/g, '');
const FMTS = ['BL', '웹툰', '게동', '영화', '기타'];

/* ============ 캐릭터 (모니터머리) ============ */
function mon(mood, size) {
  const O = '#2c3b5e', B = '#b3c0d6', H = '#93a3bf', SC = '#3a4a6b', BK = '#31416f';
  const limb = d => `<path d="${d}" fill="none" stroke="${O}" stroke-width="9" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${B}" stroke-width="5" stroke-linecap="round"/>`;
  const wave = mood === 'happy';
  // 얼굴 (머리 상단 y 기준)
  const cy = wave ? 41 : 45, mx = wave ? 49 : 55, ch = wave ? 50 : 57, lx = wave ? 32 : 33, rx = wave ? 88 : 87;
  const eyes = mood === 'happy'
    ? `<path d="M38 ${cy}q6-8 12 0M70 ${cy}q6-8 12 0" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>`
    : mood === 'sleep'
      ? `<path d="M39 ${cy}q6 5 12 0M69 ${cy}q6 5 12 0" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>`
      : `<circle cx="45" cy="${cy}" r="5.6" fill="#fff"/><circle cx="75" cy="${cy}" r="5.6" fill="#fff"/><circle cx="45.4" cy="${cy + .4}" r="2.5" fill="${O}"/><circle cx="75.4" cy="${cy + .4}" r="2.5" fill="${O}"/>`;
  const mouth = mood === 'sad' ? `<path d="M54 ${mx + 4}q6-5 12 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>` : `<path d="M54 ${mx}q6 5 12 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>`;
  const face = `${eyes}${mouth}<circle cx="${lx}" cy="${ch}" r="4.6" fill="#e8574d"/><circle cx="${rx}" cy="${ch}" r="4.6" fill="#e8574d"/>`;
  let g;
  if (wave) {
    g = `<ellipse cx="60" cy="116" rx="34" ry="3" fill="#7f8fae" opacity=".25"/>
<path d="M60 14L63 6" stroke="${O}" stroke-width="2.6" stroke-linecap="round"/><circle cx="63.5" cy="5.5" r="4" fill="#9cabc4" stroke="${O}" stroke-width="2.4"/>
${limb('M52 94L52 108')}${limb('M68 94L68 108')}<ellipse cx="50" cy="111" rx="7.5" ry="3.8" fill="${B}" stroke="${O}" stroke-width="2.4"/><ellipse cx="70" cy="111" rx="7.5" ry="3.8" fill="${B}" stroke="${O}" stroke-width="2.4"/>
<rect x="44" y="66" width="32" height="32" rx="15" fill="${B}" stroke="${O}" stroke-width="2.6"/>
${limb('M77 78Q87 85 84 95')}${limb('M43 78Q28 77 24 60')}
<rect x="16" y="14" width="88" height="56" rx="16" fill="${H}" stroke="${O}" stroke-width="2.8"/><rect x="22" y="20" width="76" height="44" rx="10" fill="${SC}"/><path d="M28 27h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".3"/>${face}<rect x="55" y="66" width="10" height="2.4" rx="1.2" fill="${O}" opacity=".5"/>`;
  } else {
    g = `<ellipse cx="60" cy="117" rx="40" ry="3" fill="#7f8fae" opacity=".25"/>
<path d="M60 14L62 6" stroke="${O}" stroke-width="2.6" stroke-linecap="round"/><circle cx="62.5" cy="5.5" r="4" fill="#9cabc4" stroke="${O}" stroke-width="2.4"/>
${limb('M47 104L42 112')}${limb('M73 104L78 112')}
<rect x="38" y="74" width="44" height="34" rx="17" fill="${B}" stroke="${O}" stroke-width="2.6"/>
<path d="M40 89L59 94L78 89L78 107L59 112L40 107Z" fill="${BK}" stroke="${O}" stroke-width="2.4" stroke-linejoin="round"/><path d="M44 92L59 96L74 92L74 105L59 109L44 105Z" fill="#eef2f9"/><path d="M59 96V109" stroke="${O}" stroke-width="1.6"/>
${limb('M40 84Q32 100 46 100')}${limb('M80 84Q88 100 74 100')}
<rect x="10" y="13" width="100" height="64" rx="17" fill="${H}" stroke="${O}" stroke-width="2.8"/><rect x="17" y="20" width="86" height="50" rx="11" fill="${SC}"/><path d="M24 27h16" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".3"/>${face}`;
  }
  return `<svg class="mon" width="${size}" height="${size}" viewBox="0 0 120 120" aria-hidden="true">${g}</svg>`;
}
const STAR = 'M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z';
function starSvg(fill, on, off) { // fill 0 / .5 / 1
  const g = `<svg viewBox="0 0 24 24"><path d="${STAR}" fill="${off || '#d3dae6'}"/>`;
  if (fill <= 0) return g + '</svg>';
  return g + `<path d="${STAR}" fill="${on || '#4c6290'}" ${fill < 1 ? 'style="clip-path:inset(0 50% 0 0)"' : ''}/></svg>`;
}

/* ============ 상태 ============ */
let DB = LS.get('br_db', null) || { v: 1, entries: [], deleted: {}, kw: { gen: [], gong: [], su: [] } };
DB.kw = DB.kw || { gen: [], gong: [], su: [] };
let CFG = LS.get('br_cfg', {});
let DR = LS.get('br_drafts', {});
const DEFAULT_CID = '177902208370-9c9ce0nabc46nlrd842dkp3sclg64fif.apps.googleusercontent.com';
if (!CFG.gcid) CFG.gcid = DEFAULT_CID;
let S = { s: 'home' };
let HOME = { q: '', fmt: '', sort: 'new', max: 60, kws: [], kwOpen: false, kwq: '' };
let WF = null;     // 작성 중 폼 상태
let saveTimer = 0, exiting = false;

function saveDB(touch = true) { if (touch) CFG.dirty = true; LS.set('br_db', DB); LS.set('br_cfg', CFG); }
function saveCFG() { LS.set('br_cfg', CFG); }
function saveDR() { LS.set('br_drafts', DR); }
const byId = id => DB.entries.find(e => e.id === id);

/* ============ 토스트/다이얼로그 ============ */
let tt = 0;
function toast(msg, act, fn, ms) {
  const t = $('#toast'); t.innerHTML = '<span>' + esc(msg) + '</span>' + (act ? '<button>' + esc(act) + '</button>' : '');
  t.style.display = 'flex'; clearTimeout(tt);
  if (act) $('button', t).onclick = () => { t.style.display = 'none'; fn && fn(); };
  tt = setTimeout(() => t.style.display = 'none', ms || (act ? 6000 : 2400));
}
function confirmBox(msg, ok = '확인', danger = false, cancel = '취소') {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'ov';
    o.innerHTML = `<div class="dlg"><p>${esc(msg)}</p><div class="r2">${cancel ? `<button class="btn" id="dn">${esc(cancel)}</button>` : ''}<button class="btn ${danger ? 'dng' : 'pri'}" id="dy">${esc(ok)}</button></div></div>`;
    document.body.appendChild(o);
    const done = v => { o.remove(); res(v); };
    $('#dy', o).onclick = () => done(true); if (cancel) $('#dn', o).onclick = () => done(false);
  });
}

/* ============ 내비게이션 / 뒤로가기 ============ */
function nav(st) { flushDraft(true); S = st; history.pushState(st, ''); render(); window.scrollTo(0, 0); }
function back() { history.back(); }
function initHistory() {
  history.replaceState({ s: 'base' }, '');
  history.pushState({ s: 'home' }, '');
  S = { s: 'home' };
}
window.addEventListener('popstate', e => {
  if (exiting) return;
  const st = e.state;
  if (lockOpen()) { history.pushState(S, ''); return; }
  if (!st || st.s === 'base') {          // 홈에서 뒤로가기 → 바로 끄지 않고 확인
    flushDraft(true); history.pushState({ s: 'home' }, ''); S = { s: 'home' }; render();
    confirmBox('앱을 종료할까요?', '종료', false, '계속 보기').then(y => { if (y) { exiting = true; history.go(-2); setTimeout(() => { exiting = false; toast('홈 화면으로 나가 주세요'); }, 400); } });
    return;
  }
  if (S.s === 'write') { const had = flushDraft(true); if (had) toast('작성 중인 내용은 임시저장됐어요'); }
  S = st; render(); window.scrollTo(0, 0);
});

/* ============ 구글 드라이브 동기화 (앱 전용 숨김 폴더) ============ */

  const kw = {}; ['gen', 'gong', 'su'].forEach(k => kw[k] = [...new Set([...((L.kw || {})[k] || []), ...((R.kw || {})[k] || [])])]);

/* ============ 비밀번호 잠금 ============ */
let LK = { mode: 'unlock', buf: '', first: '' };
const lockOpen = () => $('#lock').classList.contains('show');
async function hashPin(pin, salt) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin + ':br')); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }

}
const LK_TXT = {
  setup1: ['처음 오셨네요!', '앱을 열 때 쓸 비밀번호 4자리를 정해 주세요'], setup2: ['한 번 더 입력해 주세요', '같은 번호를 다시 눌러 주세요'],
  unlock: ['비밀번호를 입력해 주세요', '나만의 비밀 서재'], 'verify-old': ['현재 비밀번호', '변경하려면 먼저 현재 번호를 입력해 주세요'],
  change1: ['새 비밀번호', '새로 쓸 4자리를 입력해 주세요'], change2: ['새 비밀번호 확인', '한 번 더 입력해 주세요']

  LK = { mode, buf: '', first: '' }; $('#lock').classList.add('show'); $('#cover').classList.remove('show'); drawLock(note);
}
function drawLock(note) {
  const t = LK_TXT[LK.mode], mood = LK.mode === 'unlock' ? 'normal' : 'happy';
  const wait = CFG.until && CFG.until > Date.now() ? Math.ceil((CFG.until - Date.now()) / 1000) : 0;
  $('#lock').innerHTML = `${mon(wait ? 'sad' : mood, 150)}<h2>${t[0]}</h2><p class="s" id="lks">${esc(wait ? wait + '초 뒤에 다시 시도해 주세요' : (note || t[1]))}</p>
  <div class="dots" id="dts">${[0, 1, 2, 3].map(i => `<i class="${i < LK.buf.length ? 'on' : ''}"></i>`).join('')}</div>
  <div class="pad4">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button class="e"></button><button data-n="0">0</button><button class="k" data-n="x" aria-label="지우기">⌫</button></div>
  ${LK.mode === 'unlock' ? '<button class="fg" id="fgt">비밀번호를 잊으셨나요?</button>' : (LK.mode.startsWith('verify') || LK.mode.startsWith('change')) ? '<button class="fg" id="lcx">취소</button>' : ''}`;

async function onPad(e) {

  if (n === 'x') LK.buf = LK.buf.slice(0, -1); else if (LK.buf.length < 4) LK.buf += n;
  $$('#dts i').forEach((d, i) => d.classList.toggle('on', i < LK.buf.length));
  if (LK.buf.length < 4) return;
  const pin = LK.buf, m = LK.mode; LK.buf = '';
  const fail = note => { const d = $('#dts'); d.classList.add('err'); navigator.vibrate && navigator.vibrate(60); setTimeout(() => drawLock(note), 380); };
  if (m === 'unlock' || m === 'verify-old') {
    const ok = (await hashPin(pin, CFG.pin.salt)) === CFG.pin.hash;
    if (!ok) { CFG.tries = (CFG.tries || 0) + 1; if (CFG.tries >= 5) { CFG.until = Date.now() + 30000; CFG.tries = 0; saveCFG(); return drawLock(); } saveCFG(); return fail('번호가 달라요 (' + (5 - CFG.tries) + '번 남음)'); }

    const salt = Math.random().toString(36).slice(2); CFG.pin = { salt, hash: await hashPin(pin, salt) }; CFG.tries = 0; saveCFG();
    $('#lock').classList.remove('show'); lockedAt = 0; toast(m === 'setup2' ? '비밀번호를 설정했어요' : '비밀번호를 바꿨어요');
